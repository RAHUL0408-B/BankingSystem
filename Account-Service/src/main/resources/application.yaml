spring:
  application:
    name: account-service
    datasource:
      url: jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      jpa
      hibernate:
        ddl-auto: update
        show:sql:true
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect

      kafka:
        bootstrap-servers:localhost:9092
        counsumer:
          group-id: account-service-group
          auto-offset-reset: earlieast
          key-deserializer:org.apache.kafka.common.serialization.StringDeserilzer
          vlaue-deserlizer: org.apache.kafka




          producer:


          server:
            port:8081


